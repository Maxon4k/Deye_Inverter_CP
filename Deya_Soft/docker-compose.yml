services:

  postgres:
    image: postgres:16-alpine
    container_name: deye_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       deye
      POSTGRES_USER:     deye
      POSTGRES_PASSWORD: deye_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - deye_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deye -d deye"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deye_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@deye.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - deye_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  deye_net:
    driver: bridge

volumes:
  postgres_data: